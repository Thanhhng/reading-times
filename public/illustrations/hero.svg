  <rect x="218" y="46" width="84" height="20" rx="10" fill="var(--accent-2-soft, #DCEAE8)" opacity="0.85"></rect>

  
  <rect x="197" y="58" width="126" height="238" rx="26" fill="var(--surface-2, #F1EADC)" stroke="currentColor" stroke-width="3.4"></rect>
  
  <rect x="207" y="72" width="106" height="210" rx="15" fill="var(--surface, #FFFFFF)"></rect>
  
