      <stop offset="0.7" stop-color="var(--bg, #FAF6EE)"></stop>
      <stop offset="1" stop-color="var(--bg, #FAF6EE)"></stop>
    </linearGradient>
  </defs>

  
  <rect x="6" y="6" width="508" height="348" rx="30" fill="url(#heroTile)"></rect>

  
  <g stroke="var(--accent, #C4663A)" stroke-width="3.2" stroke-linecap="round">
    <circle cx="402" cy="92" r="19"></circle>
