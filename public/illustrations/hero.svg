    <path d="M402 140v-12"></path>
    <path d="M438 92h12"></path>
    <path d="M354 92h12"></path>
    <path d="M428 66l8-8"></path>
    <path d="M368 126l8-8"></path>
    <path d="M428 118l8 8"></path>
    <path d="M368 58l8 8"></path>
  </g>

  
  <path d="M96 70c0 9 3 12 12 12-9 0-12 3-12 12 0-9-3-12-12-12 9 0 12-3 12-12Z" fill="var(--accent-2, #2F7E78)" opacity="0.85"></path>

  
  <g style="font-family:var(--font-ui, sans-serif)">
